# .github/workflows/publish.yml
name: Publish Docker images to GHCR

# Run this workflow when code is pushed to the main branch
on:
  push:
    branches: ['imx8mp']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Set permissions for the GITHUB_TOKEN to allow pushing to GHCR
permissions:
  contents: write
  packages: write

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    env:
      DOCKER_ARCH: arm64
      CONTEXT_PATH: .
      DOCKERFILES_PATH: docker-materials/host/dockerfiles
      BUILD_ARGS_DEFAULTS: |
        REGISTRY=ghcr.io/ronpscg/
        tag=stable-rc
        # Add any other default build arguments here
      TAG: stable-rc

    steps:
    
      - name: Show build machine
        run: bash -c "lsb_release -a ; cat /etc/os-release ; uname -a ; free -m ; nproc ; cat /proc/cpuinfo"
      
      - name: Checkout repository
        uses: actions/checkout@v4 # Checks out your repository's code

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN is automatically created by Actions, needs 'packages: write' permission
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        id: set_vars
        run: |
          # Seems like a temporary variable is essential. Sigh...
          tmp=${{github.repository}}
          echo "LOWERCASE_REPONAME=${tmp,,}" >> $GITHUB_OUTPUT
      
      - name: Test vars
        id: test_vars
        run: |
          echo "tags: ghcr.io/${{ steps.set_vars.outputs.LOWERCASE_REPONAME }}/imx8mp.torizon-wayland-client-glmark2-tests:${{env.TAG}}"

      - name: Extract metadata (tags, labels) for Docker
        id: meta # Assign an ID to refer to the outputs of this step
        uses: docker/metadata-action@v5
        with:
          # Define image names. Uses ghcr.io/<repository owner>/<repository name>
          images: ghcr.io/${{ github.repository }}
          # Generates tags based on the event that triggered the workflow
          # - For pushes to main, it will use 'latest' and the commit SHA
          # - For tags (like v1.0.0), it will use the tag name
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image - glmark2-tests (user root)
        uses: docker/build-push-action@v5
        with:
          context: ${{env.CONTEXT_PATH}} 
          file: ${{env.DOCKERFILES_PATH}}/Dockerfile.imx8mp.torizon-wayland-client-glmark2-tests
          platforms: linux/arm64  # This is important for github actions
          push: true # Actually push the image after building
          build-args: ${{env.BUILD_ARGS_DEFAULTS}}
          # Note the macro: if the username has capital letters, it cannot be used as an image name/tag. This (bash) macro converts it to lowercase
          tags: |
            ghcr.io/${{ steps.set_vars.outputs.LOWERCASE_REPONAME }}/imx8mp.torizon-wayland-client-glmark2-tests:${{env.TAG}}
            ghcr.io/${{ steps.set_vars.outputs.LOWERCASE_REPONAME }}/${{ env.DOCKER_ARCH }}/imx8mp.torizon-wayland-client-glmark2-tests:${{env.TAG}}
          labels: ${{ steps.meta.outputs.labels }} # Use the labels generated in the previous step


      - name: Build and push Docker image - glmark2-tests (user torizon)
        uses: docker/build-push-action@v5
        with:
          context: ${{env.CONTEXT_PATH}} 
          file: ${{env.DOCKERFILES_PATH}}/Dockerfile.imx8mp.torizon-wayland-client-non-root
          platforms: linux/arm64  # This is important for github actions
          push: true # Actually push the image after building
          build-args: | 
            ${{env.BUILD_ARGS_DEFAULTS}}
            base=ghcr.io/${{ steps.set_vars.outputs.LOWERCASE_REPONAME }}/imx8mp.torizon-wayland-client-glmark2-tests
          # Note the macro: if the username has capital letters, it cannot be used as an image name/tag. This (bash) macro converts it to lowercase
          tags: |
            ghcr.io/${{ steps.set_vars.outputs.LOWERCASE_REPONAME }}/imx8mp.torizon-wayland-client-non-root-glmark2-tests:${{env.TAG}}
            ghcr.io/${{ steps.set_vars.outputs.LOWERCASE_REPONAME }}/${{ env.DOCKER_ARCH }}/imx8mp.torizon-wayland-client-non-root-glmark2-tests:${{env.TAG}}
          labels: ${{ steps.meta.outputs.labels }} # Use the labels generated in the previous step

      - name: Build and push Docker image - Tauri Trivial App (user torizon)
        uses: docker/build-push-action@v5
        with:
          context: ${{env.CONTEXT_PATH}} 
          file: ${{env.DOCKERFILES_PATH}}/Dockerfile.imx8mp.torizon.wayland-client-tauri-trivial-app
          platforms: linux/arm64  # This is important for github actions
          push: true # Actually push the image after building
          build-args: | 
            ${{env.BUILD_ARGS_DEFAULTS}}
          # Note the macro: if the username has capital letters, it cannot be used as an image name/tag. This (bash) macro converts it to lowercase
          tags: |
            ghcr.io/${{ steps.set_vars.outputs.LOWERCASE_REPONAME }}/imx8mp.torizon-wayland-client-tauri-trivial-app:${{env.TAG}}
            ghcr.io/${{ steps.set_vars.outputs.LOWERCASE_REPONAME }}/${{ env.DOCKER_ARCH }}/imx8mp.torizon-wayland-client-tauri-trivial-app:${{env.TAG}}
          labels: ${{ steps.meta.outputs.labels }} # Use the labels generated in the previous step


